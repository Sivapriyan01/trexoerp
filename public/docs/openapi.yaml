        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Product inventory detail with recent logs }
        '404': { description: Product not found }

  /api/v1/inventory/{id}/adjust:
    put:
      tags: [Inventory]
      summary: Adjust stock for a single product
      operationId: inventoryAdjust

  /api/v1/login:
    post:
      tags: [API-v1]
      summary: Get API token
      operationId: apiLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { type: object }
        '422': { description: Invalid credentials }

  /api/v1/billing:
    get:
      tags: [API-v1]
      summary: List bills (API)
      operationId: apiBillingIndex
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Bills list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Bill' } }
                  meta: { $ref: '#/components/schemas/PaginatedMeta' }
    post:
      tags: [API-v1]
      summary: Create bill (API)
      operationId: apiBillingStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, payment_mode]
              properties:
                customer_id: { type: integer, nullable: true }
                items: { type: array, items: { $ref: '#/components/schemas/BillItem' } }
                payment_mode: { type: string }
                paid: { type: number }
      responses:
        '201':
          description: Bill created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }

  /api/v1/billing/summary:
    get:
      tags: [API-v1]
      summary: Billing summary stats
      operationId: apiBillingSummary
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_sales: { type: number }
                  total_bills: { type: integer }
                  total_tax: { type: number }

  /api/v1/billing/search-customer:
    get:
      tags: [API-v1]
      summary: Search customer (API)
      operationId: apiSearchCustomer
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Matching customers
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Customer' } }

  /api/v1/billing/quick-data:
    get:
      tags: [API-v1]
      summary: Quick billing data (products + customers)
      operationId: apiQuickData
      responses:
        '200':
          description: Quick data payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  products: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  customers: { type: array, items: { $ref: '#/components/schemas/Customer' } }

  /api/v1/billing/{id}:
    get:
      tags: [API-v1]
      summary: Get bill by ID (API)
      operationId: apiBillingShow
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Bill detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
    delete:
      tags: [API-v1]
      summary: Delete bill (API)
      operationId: apiBillingDestroy
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Deleted }

  /api/v1/billing/{id}/status:
    put:
      tags: [API-v1]
      summary: Update bill status (API)
      operationId: apiBillingUpdateStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [draft, completed, returned, cancelled] }
      responses:
        '200': { description: Status updated }


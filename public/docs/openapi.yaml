openapi: 3.0.3
info:
  title: Trexo ERP - Full API Reference
  description: |
    Complete API documentation for the Trexo ERP multi-tenant platform.
    **Base URL pattern:** `http://{tenant}.localhost:8000`
    All web routes require session cookie (`auth:tenant`). API v1 routes require Bearer token.
  version: 2.0.0
  contact:
    name: Trexo ERP Support

servers:
  - url: http://{tenant}.localhost:8000
    description: Local Tenant Dev Server
    variables:
      tenant:
        default: avinash
        description: Tenant subdomain

security:
  - BearerAuth: []

tags:
  - { name: Auth, description: Login / Logout }
  - { name: Billing, description: Sales & Invoice management }
  - { name: Returns, description: Return Center }
  - { name: Delivery, description: Delivery management }
  - { name: Customers, description: Customer master }
  - { name: Suppliers, description: Supplier/Vendor master }
  - { name: Products, description: Product & Inventory (includes Product Master) }
  - { name: Inventory, description: Inventory view & history }
  - { name: StockTransfer, description: Branch stock transfers }
  - { name: Employees, description: Employee management & attendance }
  - { name: Purchase, description: Purchase orders & settlement }
  - { name: Membership, description: Membership plans & assignment }
  - { name: Instalments, description: Instalment tracking }
  - { name: WhatsApp, description: WhatsApp messaging }
  - { name: Mail, description: Mail accounts & broadcast }
  - { name: Accounting, description: Chart of accounts & journal entries }
  - { name: DailyExpense, description: Daily expenses & petty cash }
  - { name: CRM, description: CRM leads & pipeline }
  - { name: Services, description: Service/Warranty claims }
  - { name: Reminders, description: Anniversary & birthday reminders }
  - { name: Manufacturing, description: Production & manufacturing jobs }
  - { name: Calendar, description: Calendar events }
  - { name: DueInvoices, description: Overdue & unpaid invoice tracking }
  - { name: Users, description: User management & permissions }
  - { name: Tally, description: Tally ERP integration }
  - { name: BusinessReports, description: Advanced analytics & reports }
  - { name: Setup, description: Tenant configuration & backup }
  - { name: GST, description: GST validation & reports }
  - { name: Production, description: Production job management }
  - { name: API-v1, description: Sanctum token-authenticated REST API }

components:
  securitySchemes:
    BearerAuth:
      type: apiKey
      in: header
      name: Authorization

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    PaginatedMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    Customer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
        gstin: { type: string, nullable: true }
        balance: { type: number, format: float }
        created_at: { type: string, format: date-time }

    Supplier:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        gstin: { type: string, nullable: true }
        address: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    Product:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        sku: { type: string, nullable: true }
        barcode: { type: string, nullable: true }
        price: { type: number, format: float }
        cost: { type: number, format: float, nullable: true }
        stock: { type: integer }
        unit: { type: string }
        category: { type: string, nullable: true }
        tax_rate: { type: number, format: float }
        created_at: { type: string, format: date-time }

    BillItem:
      type: object
      properties:
        product_id: { type: integer }
        name: { type: string }
        qty: { type: number }
        price: { type: number, format: float }
        discount: { type: number, format: float }
        tax: { type: number, format: float }
        total: { type: number, format: float }

    Bill:
      type: object
      properties:
        id: { type: integer }
        bill_no: { type: string }
        customer_id: { type: integer, nullable: true }
        customer_name: { type: string }
        subtotal: { type: number, format: float }
        discount: { type: number, format: float }
        tax: { type: number, format: float }
        total: { type: number, format: float }
        paid: { type: number, format: float }
        balance: { type: number, format: float }
        payment_mode: { type: string }
        status: { type: string, enum: [draft, completed, returned, cancelled] }
        items:
          type: array
          items: { $ref: '#/components/schemas/BillItem' }
        created_at: { type: string, format: date-time }

    Purchase:
      type: object
      properties:
        id: { type: integer }
        invoice_ref: { type: string, nullable: true }
        supplier_id: { type: integer, nullable: true }
        supplier_name: { type: string }
        total: { type: number, format: float }
        paid: { type: number, format: float }
        balance: { type: number, format: float }
        status: { type: string, enum: [pending, partial, completed] }
        purchase_date: { type: string, format: date }
        created_at: { type: string, format: date-time }

    ReturnRecord:
      type: object
      properties:
        id: { type: integer }
        bill_id: { type: integer }
        customer_id: { type: integer, nullable: true }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, rejected, completed] }
        total_refund: { type: number, format: float }
        created_at: { type: string, format: date-time }

    Employee:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        designation: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        salary: { type: number, format: float, nullable: true }
        joined_at: { type: string, format: date, nullable: true }

    Lead:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        source: { type: string, nullable: true }
        status: { type: string }
        notes: { type: string, nullable: true }
        assigned_to: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

paths:
  # ─────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────
  /login:
    get:
      tags: [Auth]
      summary: Show login form
      operationId: showLoginForm
      security: []
      responses:
        '200':
          description: Login page HTML

    post:
      tags: [Auth]
      summary: Tenant login
      operationId: tenantLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@example.com }
                password: { type: string, example: secret }
      responses:
        '302':
          description: Redirect to dashboard on success
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /logout:
    post:
      tags: [Auth]
      summary: Tenant logout
      operationId: tenantLogout
      responses:
        '302':
          description: Redirect to login page

  # ─────────────────────────────────────────
  # BILLING
  # ─────────────────────────────────────────
  /billing:
    get:
      tags: [Billing]
      summary: Billing dashboard / list
      operationId: billingIndex
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Billing list page }

  /billing/quick:
    get:
      tags: [Billing]
      summary: Quick (POS) billing screen
      operationId: billingQuick
      responses:
        '200': { description: Quick billing HTML }

  /billing/outward:
    get:
      tags: [Billing]
      summary: Outward sales list
      operationId: billingOutward
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Outward bill list }

  /billing/outward/export:
    get:
      tags: [Billing]
      summary: Export outward bills to Excel
      operationId: billingExportOutward
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Excel file download
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /billing/customers/search:
    get:
      tags: [Billing]
      summary: Search customers (autocomplete)
      operationId: billingSearchCustomer
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Matching customers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Customer' }

  /billing/store:
    post:
      tags: [Billing]
      summary: Create a new bill/invoice
      operationId: billingStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, payment_mode]
              properties:
                customer_id: { type: integer, nullable: true }
                customer_name: { type: string }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/BillItem' }
                discount: { type: number, format: float, default: 0 }
                payment_mode: { type: string, example: Cash }
                paid: { type: number, format: float }
                notes: { type: string, nullable: true }
      responses:
        '201':
          description: Bill created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '422':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /billing/print/{bill}:
    get:
      tags: [Billing]
      summary: Print-ready invoice view
      operationId: billingPrint
      parameters:
        - { name: bill, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Printable invoice HTML }

  /billing/email/{bill}:
    post:
      tags: [Billing]
      summary: Email invoice to customer
      operationId: billingEmail
      parameters:
        - { name: bill, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Email sent confirmation }

  /billing/whatsapp/{bill}:
    post:
      tags: [Billing]
      summary: Send invoice via WhatsApp
      operationId: billingWhatsapp
      parameters:
        - { name: bill, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: WhatsApp message sent }

  /billing/products/search:
    get:
      tags: [Billing]
      summary: Search products for billing (AJAX)
      operationId: billingSearchProducts
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Matching products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }

  /billing/products/scan:
    get:
      tags: [Billing]
      summary: Scan barcode to find product
      operationId: billingScanBarcode
      parameters:
        - { name: barcode, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { description: Product not found }

  /billing/customer/lookup:
    get:
      tags: [Billing]
      summary: Lookup customer by phone
      operationId: billingLookupCustomer
      parameters:
        - { name: phone, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }

  /billing/generate:
    post:
      tags: [Billing]
      summary: Generate invoice (preview before save)
      operationId: billingGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items: { type: array, items: { $ref: '#/components/schemas/BillItem' } }
                discount: { type: number }
                tax_mode: { type: string }
      responses:
        '200':
          description: Invoice preview totals
          content:
            application/json:
              schema: { type: object }

  /billing/invoice/{bill}:
    get:
      tags: [Billing]
      summary: View invoice details (AJAX)
      operationId: billingViewInvoice
      parameters:
        - { name: bill, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Invoice data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }

  /billing/previous:
    get:
      tags: [Billing]
      summary: List previous bills for customer (AJAX)
      operationId: billingPrevious
      parameters:
        - { name: customer_id, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Previous bills list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Bill' }

  /billing/return:
    post:
      tags: [Billing]
      summary: Process invoice return (quick)
      operationId: billingReturn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bill_id]
              properties:
                bill_id: { type: integer }
                reason: { type: string }
                items: { type: array, items: { type: object } }
      responses:
        '200': { description: Return processed }

  /billing/pre-orders:
    get:
      tags: [Billing]
      summary: List pre-orders
      operationId: billingPreOrders
      responses:
        '200': { description: Pre-orders list }

  /billing/pre-orders/{bill}/status:
    post:
      tags: [Billing]
      summary: Update pre-order status
      operationId: billingPreOrderStatus
      parameters:
        - { name: bill, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [pending, confirmed, dispatched, delivered, cancelled] }
      responses:
        '200': { description: Status updated }

  /billing/pre-orders/{bill}/delivery-date:
    post:
      tags: [Billing]
      summary: Update expected delivery date
      operationId: billingPreOrderDeliveryDate
      parameters:
        - { name: bill, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delivery_date: { type: string, format: date }
      responses:
        '200': { description: Delivery date updated }

  /billing/pre-orders/{bill}/convert:
    post:
      tags: [Billing]
      summary: Convert pre-order to sales order
      operationId: billingConvertPreOrder
      parameters:
        - { name: bill, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Converted to sales order }

  /billing/gst/gstr1:
    get:
      tags: [GST]
      summary: GSTR-1 report
      operationId: gstr1
      parameters:
        - { name: month, in: query, schema: { type: integer } }
        - { name: year, in: query, schema: { type: integer } }
      responses:
        '200': { description: GSTR-1 data }

  /billing/gst/gstr3b:
    get:
      tags: [GST]
      summary: GSTR-3B summary
      operationId: gstr3b
      parameters:
        - { name: month, in: query, schema: { type: integer } }
        - { name: year, in: query, schema: { type: integer } }
      responses:
        '200': { description: GSTR-3B data }

  /billing/gst/download-json:
    get:
      tags: [GST]
      summary: Download GSTR JSON for filing
      operationId: gstDownloadJson
      responses:
        '200':
          description: JSON file
          content:
            application/json:
              schema: { type: object }

  # ─────────────────────────────────────────
  # RETURN CENTER
  # ─────────────────────────────────────────
  /api/v1/returns:
    get:
      tags: [Returns]
      summary: List all return records
      operationId: returnsIndex
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: Returns list }

    post:
      tags: [Returns]
      summary: Create a return request
      operationId: returnsStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bill_id, reason, items]
              properties:
                bill_id: { type: integer }
                reason: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      qty: { type: number }

      responses:
        '201':
          description: Return created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnRecord' }

  /api/v1/returns/{id}:
    get:
      tags: [Returns]
      summary: View a return record
      operationId: returnsShow
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Return details }

  # ─────────────────────────────────────────
  # DELIVERY
  # ─────────────────────────────────────────
  /api/v1/deliveries:
    get:
      tags: [Delivery]
      summary: List deliveries
      operationId: deliveryIndex
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Delivery list }

  /api/v1/deliveries/{bill}/status:
    post:
      tags: [Delivery]
      summary: Update delivery status for a bill
      operationId: deliveryUpdateStatus
      parameters:
        - { name: bill, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [pending, out_for_delivery, delivered, failed] }
                notes: { type: string, nullable: true }
      responses:
        '200': { description: Delivery status updated }

  # ─────────────────────────────────────────
  # CUSTOMERS
  # ─────────────────────────────────────────
  /api/v1/customers:
    get:
      tags: [Customers]
      summary: List all customers
      operationId: customersIndex
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { description: Customer list }

    post:
      tags: [Customers]
      summary: Create a customer
      operationId: customersStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                phone: { type: string }
                email: { type: string, format: email, nullable: true }
                address: { type: string, nullable: true }
                gstin: { type: string, nullable: true }
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }

  /api/v1/customers/{id}:
    get:
      tags: [Customers]
      summary: Show customer details
      operationId: customersShow
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Customer detail }

    put:
      tags: [Customers]
      summary: Update customer
      operationId: customersUpdate
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Customer' }
      responses:
        '200': { description: Customer updated }

    delete:
      tags: [Customers]
      summary: Delete customer
      operationId: customersDestroy
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Customer deleted }

  /api/v1/customers/{id}/bills:
    get:
      tags: [Customers]
      summary: Get customer bill history
      operationId: customersBills
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Customer bills }

  /api/v1/customers/{id}/ledger:
    get:
      tags: [Customers]
      summary: Get customer ledger
      operationId: customersLedger
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Customer ledger }

  # ─────────────────────────────────────────
  # VENDORS / SUPPLIERS
  # ─────────────────────────────────────────
  /api/v1/vendors:
    get:
      tags: [Suppliers]
      summary: List all vendors/suppliers
      operationId: suppliersIndex
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { description: Vendor list }

    post:
      tags: [Suppliers]
      summary: Create a vendor/supplier
      operationId: suppliersStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                phone: { type: string, nullable: true }
                email: { type: string, format: email, nullable: true }
                gstin: { type: string, nullable: true }
                address: { type: string, nullable: true }
      responses:
        '201':
          description: Vendor created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Supplier' }

  /api/v1/vendors/{id}:
    get:
      tags: [Suppliers]
      summary: Show vendor details
      operationId: suppliersShow
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Vendor detail }

    put:
      tags: [Suppliers]
      summary: Update vendor
      operationId: suppliersUpdate
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Supplier' }
      responses:
        '200': { description: Vendor updated }

    delete:
      tags: [Suppliers]
      summary: Delete vendor
      operationId: suppliersDestroy
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Vendor deleted }

  /api/v1/vendors/{id}/purchases:
    get:
      tags: [Suppliers]
      summary: Get vendor purchase history
      operationId: suppliersPurchases
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Vendor purchase history }
  # ─────────────────────────────────────────
  # PRODUCTS
  # ─────────────────────────────────────────
  /api/v1/products:
    get:
      tags: [Products]
      summary: List all products
      operationId: productsIndex
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        '200': { description: Product list }

    post:
      tags: [Products]
      summary: Create a product
      operationId: productsStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price]
              properties:
                name: { type: string }
                sku: { type: string, nullable: true }
                barcode: { type: string, nullable: true }
